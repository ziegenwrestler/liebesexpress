<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitaler Liebesexpress für Stella ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -15px rgba(225, 29, 72, 0.12);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-6px) rotate(-4deg); }
            40% { transform: translateX(6px) rotate(4deg); }
            60% { transform: translateX(-4px) rotate(-2deg); }
            80% { transform: translateX(4px) rotate(2deg); }
        }
        .shake-anim {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .float-anim {
            animation: float 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-slate-800 py-8 px-4 sm:px-6 flex flex-col items-center justify-between min-h-screen">

    <!-- Header / Badge -->
    <header class="w-full max-w-2xl text-center mb-6">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-100/90 border border-rose-200 text-rose-700 text-xs font-semibold tracking-wider uppercase shadow-sm mb-4">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
            VIP Express-Sendung #FRANZ-STELLA-2026
        </div>
        <h1 class="font-serif-title text-3xl sm:text-5xl font-bold text-slate-900 tracking-tight">
            Digitaler Liebesexpress
        </h1>
        <p class="text-rose-700/80 mt-2 text-sm sm:text-base font-medium">
            Persönliche Speziallieferung für <span class="font-bold text-rose-600 underline decoration-rose-300 decoration-2 underline-offset-4">Stella</span> ❤️
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl space-y-6 my-auto">

        <!-- Countdown & Status Card -->
        <section class="glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-rose-100">
                <div>
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Aktueller Sendungsstatus</span>
                    <div class="flex items-center gap-2 mt-1">
                        <i data-lucide="truck" class="w-5 h-5 text-rose-600"></i>
                        <h2 id="status-headline" class="text-lg sm:text-xl font-bold text-slate-800">Unterwegs zu deinem Herzen...</h2>
                    </div>
                </div>
                <div class="bg-rose-50 border border-rose-100 rounded-2xl px-4 py-2.5 text-left sm:text-right">
                    <span class="text-xs text-rose-600/80 font-medium block">Geplante Zustellung</span>
                    <span class="text-sm font-bold text-rose-900">Sonntag, 18. Okt • 18:00 Uhr</span>
                </div>
            </div>

            <!-- Countdown Grid -->
            <div id="countdown-wrapper" class="py-6">
                <p class="text-center text-xs font-semibold uppercase tracking-widest text-rose-500 mb-4">
                    Zustellung erfolgt in:
                </p>
                <div class="grid grid-cols-4 gap-2 sm:gap-4 text-center">
                    <div class="bg-white/90 border border-rose-100 rounded-2xl p-3 sm:p-4 shadow-sm">
                        <span id="cd-days" class="block text-2xl sm:text-4xl font-extrabold text-rose-600 font-serif-title">00</span>
                        <span class="text-[11px] sm:text-xs font-medium text-slate-500 uppercase tracking-wider mt-1 block">Tage</span>
                    </div>
                    <div class="bg-white/90 border border-rose-100 rounded-2xl p-3 sm:p-4 shadow-sm">
                        <span id="cd-hours" class="block text-2xl sm:text-4xl font-extrabold text-rose-600 font-serif-title">00</span>
                        <span class="text-[11px] sm:text-xs font-medium text-slate-500 uppercase tracking-wider mt-1 block">Stunden</span>
                    </div>
                    <div class="bg-white/90 border border-rose-100 rounded-2xl p-3 sm:p-4 shadow-sm">
                        <span id="cd-mins" class="block text-2xl sm:text-4xl font-extrabold text-rose-600 font-serif-title">00</span>
                        <span class="text-[11px] sm:text-xs font-medium text-slate-500 uppercase tracking-wider mt-1 block">Minuten</span>
                    </div>
                    <div class="bg-white/90 border border-rose-100 rounded-2xl p-3 sm:p-4 shadow-sm">
                        <span id="cd-secs" class="block text-2xl sm:text-4xl font-extrabold text-rose-600 font-serif-title">00</span>
                        <span class="text-[11px] sm:text-xs font-medium text-slate-500 uppercase tracking-wider mt-1 block">Sekunden</span>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-2">
                <div class="flex
